name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y openjdk-17-jdk git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev automake build-essential
        pip install buildozer cython==0.29.33
    
    - name: Build APK
      run: |
        echo "y" | buildozer android debug deploy run
    
    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: PrecisionCalc-APK
        path: bin/*.apk
