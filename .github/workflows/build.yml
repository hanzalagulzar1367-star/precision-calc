# CELL 60: CIRCLECI - ANOTHER FAST ALTERNATIVE
import os

os.chdir('/content/PrecisionCalc')

# Create CircleCI config
os.makedirs('.circleci', exist_ok=True)

circleci_config = '''version: 2.1

jobs:
  build:
    docker:
      - image: cimg/python:3.9
    
    steps:
      - checkout
      
      - run:
          name: Install dependencies
          command: |
            sudo apt update
            sudo apt install -y openjdk-17-jdk git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev automake build-essential
            pip install buildozer==1.5.0 cython==0.29.33
      
      - run:
          name: Build APK
          command: |
            echo "y" | buildozer android debug deploy run
      
      - store_artifacts:
          path: bin
          destination: apk

workflows:
  build-apk:
    jobs:
      - build
'''

with open('.circleci/config.yml', 'w') as f:
    f.write(circleci_config)

print("✅ CircleCI config created!")
print("""
======================================================================
